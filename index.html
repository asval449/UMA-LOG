<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ウマログ</title>
<style>
:root{--ac:#d32f2f;--bg:#fff;--tx:#222;--ln:#e5e5e5;--mu:#555;--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#fff;--tx:#222}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:var(--fs)/1.5 -apple-system,"Hiragino Sans",Meiryo,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:1.6em;margin:.2em 0;color:var(--ac)}h2{font-size:1.15em;margin:1em 0 .4em;border-left:5px solid var(--ac);padding-left:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{flex:1;text-align:center;padding:8px 0;color:var(--mu);text-decoration:none;font-size:.68em;min-height:56px}nav a b{display:block;font-size:1.5em}nav a.on{color:var(--ac);font-weight:700}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:1em;min-height:44px;cursor:pointer}.btn.g{background:#eee;color:#222}.btn.d{background:#fff;color:#c00;border:1px solid #c00}.btn.w{width:100%;margin:6px 0}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.tabs button{flex:1;border:1px solid var(--ln);background:#fff;border-radius:20px;padding:9px 10px;font-size:.9em;min-height:40px;white-space:nowrap}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.no{background:var(--ac);color:#fff;font-weight:700;min-width:46px;height:46px;border-radius:6px;display:flex;align-items:center;justify-content:center}.no.e{background:#ccc}
.mid{flex:1;min-width:0}.nm{font-weight:700;font-size:1.1em}.sub{color:var(--mu);font-size:.85em;display:flex;gap:10px;flex-wrap:wrap}.ar{color:var(--mu);font-size:1.4em}
.lb{display:inline-block;font-size:.7em;padding:1px 7px;border-radius:4px;border:1px solid #ccc;margin-left:6px;vertical-align:middle;font-weight:700}
.c1{background:#1565c0;color:#fff;border-color:#1565c0}.c2{background:#d32f2f;color:#fff;border-color:#d32f2f}.c3{background:#2eaf3a;color:#fff;border-color:#2eaf3a}
.s-美浦{background:#d32f2f;color:#fff}.s-栗東{background:#1565c0;color:#fff}.s-地方{background:#2e7d32;color:#fff}.s-海外{background:#111;color:#fff}
.st-出馬確定{background:#d32f2f;color:#fff}.st-登録{background:#1565c0;color:#fff}.st-予定{background:#777;color:#fff}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--ln);padding:8px;text-align:left}th{background:#f6f6f6;width:32%;font-weight:600}
label{display:block;margin:10px 0 3px;font-weight:600;font-size:.9em}input,select,textarea{width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;font-size:1em;background:#fff;color:#222}
.err{background:#fdecea;color:#b71c1c;padding:8px;border-radius:6px;margin:8px 0}.mu{color:var(--mu)}.row{display:flex;gap:8px}.row>*{flex:1}
.demo{background:#fff3cd;font-size:.75em;padding:1px 6px;border-radius:4px}
.no{background:#c62f35;border-radius:8px;min-width:58px;height:58px;font-size:1.15em}.no.e{background:#ccc}.nm{font-size:1.25em;line-height:1.3}.card{padding:12px 4px;gap:12px}.sub{font-size:.95em;gap:8px;color:#444}.sf{color:#2e8b3d;font-weight:600}.sd{color:#8d5a00}.go{width:40px;height:40px;border:1.5px solid #777;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.75em;color:#333;flex:none}.lb{border:0;border-radius:14px;padding:2px 10px;font-size:.72em}.lg{background:#777;color:#fff}.hn{font-size:1.9em;font-weight:800;margin:.1em 0}.pl{background:#999;color:#fff;border-radius:14px;padding:1px 10px;font-size:.8em}.memo{background:#f2f2f2;border-radius:8px;padding:14px;color:#999;display:flex;justify-content:space-between;margin:14px 0 6px;font-size:1.1em;cursor:pointer}.pt{border-top:1px solid #ccc}.pt th{width:27%;text-align:center;color:#444;background:#e8e8e8;font-weight:400;border:0;border-bottom:1px solid #fff;padding:16px 6px}.pt td{border:0;border-bottom:1px solid #ddd;font-weight:700;color:#0d47a1;font-size:1.1em}.pt .f th{background:#639fdc;color:#fff;font-weight:700}.pt .f td{background:#cfe0f0}.pt .m th{background:#d1768b;color:#fff;font-weight:700}.pt .m td{background:#f3dde2}.pt td.pl2{color:#222;font-weight:400}.st{font-size:.85em}.st th{width:auto;cursor:pointer;background:#f6f6f6;padding:8px 3px;text-align:center;font-weight:600;white-space:nowrap}.st td{padding:9px 3px;text-align:center}.st td.en{text-align:left;font-weight:800;color:#0d47a1;font-size:1.05em}.st td.wn{font-weight:800;width:40px;font-size:1.05em}
.pl.s-美浦,.lb.s-美浦{background:#d32f2f;color:#fff}.pl.s-栗東,.lb.s-栗東{background:#1565c0;color:#fff}.pl.s-地方,.lb.s-地方{background:#2e7d32;color:#fff}.pl.s-海外,.lb.s-海外{background:#111;color:#fff}
.mc{border:1px solid #ddd;border-radius:6px;padding:16px;margin:12px 0;cursor:pointer}.mn{font-size:1.5em;font-weight:800}.mn .lb{font-size:.55em}.md{color:#444;margin-top:6px}.bar{background:#eaeaea;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin:8px 0}.tabs button{border-radius:24px}
.ban{background:#f2f2f2;border-radius:8px;padding:14px;text-align:center;font-weight:800;font-size:1.2em;margin:8px 0}.rk{display:inline-block;min-width:32px;text-align:center;border:1px solid #bbb;background:#e6e6e6;font-weight:700;padding:0 6px;margin-right:6px}.rk1{background:#ffe94d;border-color:#d9c300}.rk2{background:#cdeaf9;border-color:#6ab}.rk3{background:#fad4d4;border-color:#d88}
details{border:1px solid var(--ln);border-radius:8px;padding:10px;margin:8px 0}summary{font-weight:700;cursor:pointer}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const G1=['GⅠ','JpnⅠ'],G2=['GⅡ','JpnⅡ'],G3=['GⅢ','JpnⅢ'];
const JRA=['東京','中山','阪神','京都','函館','札幌','福島','新潟','中京','小倉'];
const LOC=['門別','盛岡','水沢','浦和','船橋','大井','川崎','金沢','笠松','名古屋','園田','姫路','高知','佐賀'];
const CLS={jra:['GⅠ','GⅡ','GⅢ','オープン','3勝クラス','2勝クラス','1勝クラス','未勝利','新馬','その他'],loc:['GⅠ','JpnⅠ','JpnⅡ','JpnⅢ','その他'],ovs:['GⅠ','GⅡ','GⅢ','その他']};
const CATN={jra:'中央競馬',loc:'地方競馬',ovs:'海外競馬'};
const DIVS=['美浦','栗東','地方','海外'];
let S={races:[],horses:[],stables:[],meets:[],wv:{},venues:[],set:{color:'#d32f2f',size:'標準'}};
let V={cat:'jra',venue:'東京',date:today(),div:'',stable:'',q:'',id:null,pre:{},err:''};
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* storage: IndexedDB with fallback */
let db=null;
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('umalog',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function load(){return new Promise(r=>{if(!db){try{r(JSON.parse(localStorage.getItem('umalog')))}catch(e){r(null)}return}const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
function save(){if(db){try{db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}}else{try{localStorage.setItem('umalog',JSON.stringify(S))}catch(e){}}}
function yen(n){n=+n||0;if(!n)return '0円';const o=Math.floor(n/1e8),m=Math.floor(n%1e8/1e4),e=n%1e4;return (o?o+'億':'')+(m?m.toLocaleString()+'万':'')+(e?e.toLocaleString():'')+'円'}
function clsLb(c){const k=G1.includes(c)?'c1':G2.includes(c)?'c2':G3.includes(c)?'c3':'';if(!k){const s={'3勝クラス':'3勝','2勝クラス':'2勝','1勝クラス':'1勝'}[c];return s?`<span class="lb lg">${s}</span>`:''}return `<span class="lb ${k}">${esc(c)}</span>`}
function wd(d){return d?d.replace(/-/g,'/'):''}
const stName=id=>(S.stables.find(s=>s.id===id)||{}).name||'未設定';
/* routing */
const NAV=[['home','🏠','ホーム'],['races','🏇','レース'],['horses','🐴','注目馬'],['stables','🏠','厩舎'],['settings','⚙️','設定']];
const BASE={entryform:'races',raceform:'races',race:'races',meetform:'races',horse:'horses',horseform:'horses',resultform:'horses',resultview:'horses',stable:'stables',stableform:'stables'};
function go(v,id,pre){V.id=id??null;V.pre=pre||{};V.err='';location.hash=v}
function view(){return location.hash.slice(1)||'home'}
function render(){
 const v=view(),b=BASE[v]||v;
 document.documentElement.style.setProperty('--ac',S.set.color);
 document.documentElement.style.setProperty('--fs',{小:'14px',標準:'16px',大:'19px'}[S.set.size]);
 $('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===b?'on':''}"><b>${n[1]}</b>${n[2]}</a>`).join('');
 const f={home,races,race:raceDetail,raceform,meetform,entryform,horses,stables,resultform,resultview,horse:horseDetail,horseform,stable:stableDetail,stableform,settings}[v]||home;
 $('#app').innerHTML=f();window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
const E=()=>V.err?`<div class="err">${esc(V.err)}</div>`:'';
/* home */
function weekEnd(){const d=new Date();d.setDate(d.getDate()+(7-d.getDay())%7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function raceCard(r){return `<div class="card" onclick="go('race','${r.id}')"><div class="no">${r.cat==='jra'?r.no+'R':esc(r.no)+'R'}</div><div class="mid"><div class="nm">${esc(r.name)}${clsLb(r.cls)}</div><div class="sub">${view()==='home'||V.pf?`<span>${V.rm==='past'?wd(r.date):wd(r.date).slice(5)} ${esc(r.venue)}</span>`:''}<span>${esc(r.time||'')}</span><span class="${r.surf==='芝'?'sf':r.surf==='ダート'?'sd':''}">${r.surf==='ダート'?'ダ':esc(r.surf)}${r.dist}m</span><span>${r.heads}頭</span>${r.memo?'<span>📝</span>':''}</div></div><div class="go">▼</div></div>`}
function home0(){
 const t=today(),e=weekEnd(),gr=S.races.filter(r=>r.date>=t&&r.date<=e&&[...G1,...G2,...G3].includes(r.cls)).sort((a,b)=>a.date.localeCompare(b.date)||a.time?.localeCompare(b.time||''));
 return `<h1>ウマログ</h1><p><b>ウマログへようこそ！</b><br>競馬をもっと楽しく。愛馬の記録を、あなたの手の中に。</p><p class="mu">ウマログは、競馬のレース情報やお気に入りの注目馬を自由に記録・管理できるアプリです。気になる馬の情報を残して、自分だけの競馬データベースを作りましょう！</p>
 <h2>今週の重賞</h2>${gr.length?gr.map(raceCard).join(''):'<p class="mu">今週の重賞は登録されていません</p>'}
 <button class="btn w" onclick="go('raceform')">＋ レースを登録</button>`}
/* races */
function venues(){return V.cat==='jra'?JRA:V.cat==='loc'?LOC:S.venues}
const DW='日月火水木金土';
function mainCard(r){const d=new Date(r.date+'T00:00:00');return `<div class="mc" onclick="go('race','${r.id}')"><div class="mn">${esc(r.name)}${clsLb(r.cls)}</div><div class="md">${d.getMonth()+1}月${d.getDate()}日(${DW[d.getDay()]}) ${esc(r.venue)} ${r.no}R ${esc(r.surf)}${r.dist}m</div></div>`}
function home(){const t=today(),e=weekEnd(),gr=S.races.filter(r=>r.main&&r.date>=t&&r.date<=e).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
 return `<h1>ウマログ</h1><p><b>ウマログへようこそ！</b></p><p class="mu">ウマログは、競馬のレース情報やお気に入りの注目馬を自由に記録・管理できるアプリです。気になる馬の情報を残して、自分だけの競馬データベースを作りましょう！</p>
 <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px"><b style="font-size:1.5em">今週の注目レース</b><button class="btn g" style="border-radius:20px;padding:8px 18px" onclick="go('races')">もっと見る</button></div>
 ${gr.length?gr.map(mainCard).join(''):'<p class="mu">今週のメインレースは登録されていません</p>'}
 <h2 style="margin-top:22px">今週のレース</h2>${weekRaces().length?grouped(weekRaces()):'<p class="mu">今週のレースは登録されていません</p>'}
 <button class="btn w" onclick="go('raceform')">＋ レースを登録</button>`}
function held(){return [...new Set([...S.meets,...S.races].filter(x=>x.cat===V.cat&&x.date===V.date).map(x=>x.venue))]}
function weekRange(){const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'),d=new Date(),a=new Date(d),b=new Date(d);a.setDate(d.getDate()-(d.getDay()+6)%7);b.setDate(a.getDate()+6);return [f(a),f(b)]}
const rsort=(x,y)=>x.date.localeCompare(y.date)||x.venue.localeCompare(y.venue,'ja')||x.no-y.no;
function weekRaces(){const [a,b]=weekRange();return S.races.filter(r=>r.date>=a&&r.date<=b).sort(rsort)}
function grouped(l){let d='',o='';l.forEach(r=>{if(r.date!==d){d=r.date;o+=`<h2>${wd(d)}(${DW[new Date(d+'T00:00:00').getDay()]})</h2>`}o+=raceCard(r)});return o}
function rmTabs(){const m=V.rm||'week';return `<div class="tabs">${[['week','今週'],['past','過去のレース'],['day','開催日別']].map(a=>`<button class="${m===a[0]?'on':''}" onclick="V.rm='${a[0]}';render()">${a[1]}</button>`).join('')}</div>`}
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function addDays(t,n){const d=new Date(t+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d)}
function wkStart(t){const d=new Date(t+'T00:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return fmt(d)}
function gwv(ws){const w=S.wv&&S.wv[ws];if(w)return w;return [...new Set([...S.meets,...S.races].filter(x=>x.cat==='jra'&&x.date>=ws&&x.date<=addDays(ws,6)).map(x=>x.venue))].slice(0,3)}
function togV(v){const ws=V.wk||wkStart(today());let l=[...gwv(ws)];if(l.includes(v))l=l.filter(x=>x!==v);else{if(l.length>=3){alert('開催競馬場は最大3場までです');return}l.push(v)}S.wv=S.wv||{};S.wv[ws]=l;if(!l.includes(V.venue))V.venue=l[0]||'';save();render()}
function ensureV(cat,date,venue){V.cat=cat;V.date=date;V.venue=venue;V.wd=date;V.wk=wkStart(date);if(cat==='jra'){S.wv=S.wv||{};const l=S.wv[V.wk];if(l&&!l.includes(venue)&&l.length<3)l.push(venue)}}
function races(){const ws=V.wk||wkStart(today()),we=addDays(ws,6),cur=ws===wkStart(today()),md=t=>t.slice(5).replace('-','/');
 let body='';
 if(V.cat==='jra'){const vs=gwv(ws),days=[...new Set([...S.races,...S.meets].filter(x=>x.cat==='jra'&&x.date>=ws&&x.date<=we).map(x=>x.date))].sort();
  if(!days.includes(V.wd))V.wd=days.includes(today())?today():(days[0]||'');if(!vs.includes(V.venue))V.venue=vs[0]||'';
  const list=S.races.filter(r=>r.cat==='jra'&&r.venue===V.venue&&r.date===V.wd),mt=S.meets.find(x=>x.cat==='jra'&&x.date===V.wd&&x.venue===V.venue);
  body=`<h2>開催競馬場（最大3場）</h2><div class="tabs">${vs.map(v=>`<button class="${v===V.venue?'on':''}" onclick="V.venue='${esc(v)}';render()">${esc(v)}</button>`).join('')}<button style="flex:0 0 auto" onclick="V.vsel=!V.vsel;render()">${V.vsel?'閉じる':'選ぶ'}</button></div>
  ${V.vsel?`<div class="tabs">${JRA.map(v=>`<button class="${vs.includes(v)?'on':''}" style="flex:0 0 auto" onclick="togV('${v}')">${v}</button>`).join('')}</div><p class="mu" style="font-size:.85em">タップで選択・解除（最大3場）</p>`:''}
  ${days.length?`<div class="tabs">${days.map(d=>`<button class="${d===V.wd?'on':''}" onclick="V.wd='${d}';render()">${DW[new Date(d+'T00:00:00').getDay()]}曜 ${md(d)}</button>`).join('')}</div>`:'<p class="mu">この週に登録されたレースはありません</p>'}
  ${V.venue&&V.wd?`<div class="bar"><span>${esc(mt&&mt.info?mt.info:'開催情報なし')}</span><button class="btn g" style="min-height:34px;padding:4px 14px" onclick="go('meetform',${mt?`'${mt.id}'`:'null'},{cat:'jra',date:'${V.wd}',venue:'${V.venue}'})">${mt?'編集':'設定'}</button></div>${Array.from({length:12},(_,i)=>{const r=list.find(x=>+x.no===i+1);return r?raceCard(r):`<div class="card" onclick="go('raceform',null,{cat:'jra',venue:'${V.venue}',date:'${V.wd}',no:${i+1}})"><div class="no e">${i+1}R</div><div class="mid mu">未登録（タップして登録）</div><div class="go">＋</div></div>`}).join('')}`:(vs.length?'':'<p class="mu">「選ぶ」から開催競馬場を選んでください</p>')}
  <button class="btn g w" onclick="go('raceform',null,{cat:'jra',venue:'${V.venue}',date:'${V.wd||ws}'})">＋ レース登録（日付は登録画面で変更）</button>`}
 else{const w=S.races.filter(r=>r.cat===V.cat&&r.date>=ws&&r.date<=we).sort(rsort);V.pf=true;const g=w.length?grouped(w):'<p class="mu">この週に登録されたレースはありません</p>';V.pf=false;
  body=g+`<button class="btn w" onclick="go('raceform',null,{cat:'${V.cat}',date:'${ws}'})">＋ レース登録</button>`}
 return `<h1>レース</h1><div class="tabs">${Object.keys(CATN).map(k=>`<button class="${k===V.cat?'on':''}" onclick="V.cat='${k}';render()">${CATN[k]}</button>`).join('')}</div>
 <div class="bar"><button class="btn g" style="min-height:38px;padding:4px 12px" onclick="V.wk=addDays('${ws}',-7);render()">‹ 前週</button><div style="text-align:center"><b>${cur?'今週':md(ws)+'〜'+md(we)}</b>${cur?`<div class="mu" style="font-size:.8em">${md(ws)}〜${md(we)}</div>`:''}</div><button class="btn g" style="min-height:38px;padding:4px 12px" onclick="V.wk=addDays('${ws}',7);render()">次週 ›</button></div>
 <label>カレンダーで週を選ぶ（過去にさかのぼれます）</label><input type="date" value="${ws}" onchange="if(this.value){V.wk=wkStart(this.value);render()}">${cur?'':'<button class="btn g w" onclick="V.wk=null;render()">今週に戻る</button>'}
 ${body}`}
function races1(){const m=V.rm||'week';
