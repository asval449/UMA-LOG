<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ウマログ</title>
<style>
:root{--bg:#f5f6f8;--cd:#fff;--tx:#1a1a1a;--sb:#5f6368;--ac:#9a7200;--gr:#2ecc71;--rd:#d93025;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:720px;margin:0 auto;padding:12px 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-weight:800;font-size:20px;color:var(--ac)}.tag{color:var(--sb);font-size:12px}
.card{background:var(--cd);border:1px solid #e3e5e8;box-shadow:0 1px 3px rgba(0,0,0,.06);border-radius:12px;padding:12px;margin:8px 0;transition:.15s}.tap{cursor:pointer}.tap:active{transform:scale(.98);background:#eef0f3}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{font-size:28px;font-weight:800;color:var(--ac)}.sm{font-size:12px;color:var(--sb)}
h2{font-size:17px;margin:18px 0 6px}h3{margin:0 0 4px;font-size:16px}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;margin:2px 3px 2px 0;background:#e8eaed;color:#333}
.b.未回顧{background:var(--rd);color:#fff}.b.回顧中{background:#e0a800;color:#000}.b.回顧済み{background:var(--gr);color:#000}.b.demo{background:#fff3cd;color:#664d03}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
button.s{background:#e8eaed;color:#222}button.d{background:var(--rd);color:#fff}button:active{opacity:.7}
input,select,textarea{width:100%;background:#fff;color:var(--tx);border:1px solid #c4c7cc;border-radius:8px;padding:9px;font:inherit;margin:3px 0 8px}
label{font-size:12px;color:var(--sb)}textarea{min-height:64px}
.chip{display:inline-block;margin:2px;font-size:12px;color:var(--tx)}.chip input{display:none}
.chip span{display:inline-block;padding:4px 10px;border-radius:99px;background:#e8eaed;color:#222}.chip:has(input:checked) span{background:var(--ac);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;border-bottom:1px solid #e0e0e0;text-align:left}
.sc{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bar{height:14px;background:var(--ac);border-radius:4px;min-width:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dadce0;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{flex:1;text-align:center;padding:10px 0;color:var(--sb);font-size:12px;text-decoration:none;cursor:pointer}nav a.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;display:none;z-index:9}
.empty{text-align:center;color:var(--sb);padding:28px 0}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<nav id="nav"></nav>
<script>
const K='umalog_v1',$=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TAGS=['展開有利','展開不利','能力上位','能力不足','距離適性あり','距離不適','馬場適性あり','馬場不適','次走狙い'],STY=['逃げ','先行','差し','追込'],ST=['未回顧','回顧中','回顧済み'],CHK=['未確認','出走待ち','確認済み'];
function H(n,a){return a.map((x,i)=>({no:i+1,pos:i+1,name:x[0],time:x[1],l3f:x[2],pop:x[3],style:x[4]}))}
function demo(){const mk=(id,name,date,course,dist,surface,going,pace,hs)=>({id,name,date,course,dist,surface,going,pace,demo:true,horses:H(0,hs)});
return[mk('d1','デモ記念','2026-11-15','東京',2000,'芝','良','ミドル',[['アサヒノカゼ','1:59.8','34.2',2,'先行'],['ミライトップ','1:59.9','33.5',1,'差し'],['ゴールドサンプル','2:00.1','34.8',4,'逃げ'],['ノースデモ','2:00.3','34.0',3,'先行'],['ハルノテスト','2:00.8','35.1',6,'追込']]),
mk('d2','サンプルステークス','2026-11-08','京都',1600,'ダート','稍重','ハイ',[['ユメノダミー','1:36.2','36.9',3,'差し'],['カゼノサンプル','1:36.4','36.5',1,'追込'],['トップデモ','1:36.9','37.8',2,'先行'],['テストノヒカリ','1:37.3','38.0',5,'逃げ']]),
mk('d3','テスト特別','2026-11-22','中山',1800,'芝','重','スロー',[['ミライトップ','1:50.1','35.0',1,'先行'],['サクラダミー','1:50.2','34.1',4,'差し'],['アサヒノカゼ','1:50.5','35.6',2,'逃げ'],['ホシノテスト','1:50.9','35.9',3,'先行']])]}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={races:demo(),rev:{},watch:[],user:'ゲスト'};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2000)}
const go=h=>location.hash=h,R=id=>S.races.find(r=>r.id==id),st=id=>(S.rev[id]||{}).status||'未回顧',F={};
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const chips=(id,sel=[],a=TAGS)=>`<div id="${id}">${a.map(t=>`<label class="chip"><input type="checkbox" value="${t}" ${sel.includes(t)?'checked':''}><span>${t}</span></label>`).join('')}</div>`;
const chk=id=>[...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value);
function head(t,back){return`<header>${back?`<button class="s" onclick="history.length>1?history.back():go('home')">←戻る</button>`:`<div><div class="logo">ウマログ</div><div class="tag">競馬の気づきを、未来の一勝へ。</div></div>`}<div>${back?`<b>${t}</b>`:`<button class="s" onclick="notif()">🔔</button> <button class="s" onclick="go('me')">👤</button>`}</div></header>`}
function rcard(r){return`<div class="card tap" onclick="go('race-${r.id}')"><h3>${esc(r.name)} <span class="b ${st(r.id)}">${st(r.id)}</span>${r.demo?'<span class="b demo">デモデータ</span>':''}</h3><div class="sm">${r.date}｜${esc(r.course)}｜${r.surface}${r.dist}m｜馬場:${r.going}｜ペース:${r.pace}</div></div>`}
function wcard(w){return`<div class="card tap" onclick="go('w-${w.id}')"><h3>${esc(w.name)} <span class="b">${w.kind}</span><span class="b">${w.check}</span></h3><div class="sm">前走: ${esc(w.prev||'未入力')}</div><div>${(w.reasons||[]).map(t=>`<span class="b">${t}</span>`).join('')}</div></div>`}
function home(){const rv=S.races.filter(r=>st(r.id)=='回顧済み').length,nx=S.watch.filter(w=>w.kind=='次走注目'&&w.check!='確認済み').length;
const rs=[...S.races].sort((a,b)=>(st(a.id)=='未回顧'?0:1)-(st(b.id)=='未回顧'?0:1)||b.date.localeCompare(a.date)).slice(0,4);
return head()+`<div class="g3">${[['回顧したレース',rv],['注目馬',S.watch.length],['次走チェック',nx]].map(x=>`<div class="card"><div class="num">${x[1]}</div><div class="sm">${x[0]}</div></div>`).join('')}</div>
<h2>レース回顧</h2>${rs.map(rcard).join('')||'<div class="empty">レースがありません</div>'}
<h2>次走注目馬</h2>${S.watch.slice(0,3).map(wcard).join('')||'<div class="empty">注目馬は未登録です</div>'}
<h2>分析メニュー</h2><div class="g2">${[['回顧ノート','notes'],['データ分析','ana'],['注目馬管理','watch'],['レース履歴','races']].map(x=>`<div class="card tap" onclick="go('${x[1]}')"><b>${x[0]}</b></div>`).join('')}</div>`}
function notif(){const n=S.races.filter(r=>st(r.id)=='未回顧').length;F.s='未回顧';toast(n?`未回顧のレースが${n}件あります`:'未回顧のレースはありません');go('races')}
function races(){return head()+`<div class="card"><div class="g2"><div><label>開催日</label><input type="date" id="f1" oninput="fl()" value="${F.d||''}"></div><div><label>競馬場</label><input id="f2" oninput="fl()" value="${F.c||''}"></div><div><label>レース名</label><input id="f3" oninput="fl()" value="${F.n||''}"></div><div><label>距離(m)</label><input id="f4" type="number" oninput="fl()" value="${F.l||''}"></div><div><label>芝・ダート</label><select id="f5" onchange="fl()">${['','芝','ダート'].map(x=>`<option ${x==F.t?'selected':''}>${x}</option>`).join('')}</select></div><div><label>回顧状況</label><select id="f6" onchange="fl()">${['',...ST].map(x=>`<option ${x==F.s?'selected':''}>${x}</option>`).join('')}</select></div></div></div><div class="row"><button onclick="go('newrace')">＋レースを手動登録</button><button class="s" onclick="Object.keys(F).forEach(k=>delete F[k]);render()">条件クリア</button></div><div id="rl">${rlist()}</div>`}
function fl(){F.d=$('f1').value;F.c=$('f2').value;F.n=$('f3').value;F.l=$('f4').value;F.t=$('f5').value;F.s=$('f6').value;$('rl').innerHTML=rlist()}
function rlist(){const a=S.races.filter(r=>(!F.d||r.date==F.d)&&(!F.c||r.course.includes(F.c))&&(!F.n||r.name.includes(F.n))&&(!F.l||r.dist==F.l)&&(!F.t||r.surface==F.t)&&(!F.s||st(r.id)==F.s)).sort((a,b)=>b.date.localeCompare(a.date));return a.map(rcard).join('')||'<div class="empty">条件に合うレースがありません</div>'}
function rform(id){const r=R(id)||{name:'',date:'',course:'',dist:'',surface:'芝',going:'良',pace:'ミドル',horses:[]};
return head(id?'レース編集':'レース登録',1)+`<div class="card"><label>レース名*</label><input id="n" value="${esc(r.name)}"><label>開催日*</label><input type="date" id="d" value="${r.date}"><label>競馬場</label><input id="c" value="${esc(r.course)}"><label>距離(m)</label><input id="l" type="number" value="${r.dist}"><div class="g3"><div><label>芝・ダート</label><select id="t">${opt(['芝','ダート'],r.surface)}</select></div><div><label>馬場</label><select id="g">${opt(['良','稍重','重','不良'],r.going)}</select></div><div><label>ペース</label><select id="p">${opt(['スロー','ミドル','ハイ'],r.pace)}</select></div></div>
<label>出走馬（1行1頭: 馬名,タイム,上がり3F,人気,脚質　※上から着順）</label><textarea id="hs" style="min-height:120px">${r.horses.map(h=>[h.name,h.time,h.l3f,h.pop,h.style].join(',')).join('\n')}</textarea><button onclick="saveRace('${id||''}')">保存</button></div>`}
function saveRace(id){const n=$('n').value.trim(),d=$('d').value;if(!n||!d)return toast('レース名と開催日は必須です');
const hs=$('hs').value.split('\n').map(s=>s.trim()).filter(Boolean).map((s,i)=>{const a=s.split(',').map(x=>x.trim());return{no:i+1,pos:i+1,name:a[0],time:a[1]||'',l3f:a[2]||'',pop:a[3]||'',style:a[4]||''}});
const o={id:id||'r'+Date.now(),name:n,date:d,course:$('c').value,dist:$('l').value,surface:$('t').value,going:$('g').value,pace:$('p').value,horses:hs,demo:id?!!R(id).demo:false};
if(id)S.races[S.races.findIndex(r=>r.id==id)]=o;else S.races.push(o);save();toast('保存しました');go('race-'+o.id)}
function raceD(id){const r=R(id);if(!r)return head('',1)+'<div class="empty">レースが見つかりません</div>';
return head('レース詳細',1)+`<div class="card"><h3>${esc(r.name)} <span class="b ${st(id)}">${st(id)}</span>${r.demo?'<span class="b demo">デモデータ</span>':''}</h3><div class="sm">${r.date}｜${esc(r.course)}｜${r.surface}${r.dist}m｜馬場:${r.going}｜ペース:${r.pace}</div></div>
<div class="card sc"><table><tr><th>着</th><th>馬名</th><th>タイム</th><th>上3F</th><th>人気</th><th>脚質</th></tr>${r.horses.map(h=>`<tr><td>${h.pos}</td><td>${esc(h.name)}</td><td>${esc(h.time)}</td><td>${esc(h.l3f)}</td><td>${esc(h.pop)}</td><td>${esc(h.style)}</td></tr>`).join('')||'<tr><td colspan=6 class="empty">出走馬が未登録です（編集から追加）</td></tr>'}</table></div>
<div class="row"><button onclick="go('rv-${id}')">回顧する</button><button class="s" onclick="go('redit-${id}')">編集</button><button class="d" onclick="delRace('${id}')">削除</button></div>`}
function delRace(id){if(!confirm('このレースと回顧を削除しますか？'))return;S.races=S.races.filter(r=>r.id!=id);delete S.rev[id];save();toast('削除しました');go('races')}
function review(id){const r=R(id),v=S.rev[id]||{h:{}};if(!r)return head('',1)+'<div class="empty">レースが見つかりません</div>';
const T=(k,l)=>`<label>${l}</label><textarea id="${k}">${esc(v[k])}</textarea>`;
return head('レース回顧',1)+`<div class="card"><h3>${esc(r.name)}</h3><label>回顧状況</label><select id="st">${opt(ST,v.status||'回顧中')}</select>${T('memo','レース全体の感想')}${T('flow','レース展開')}${T('good','好走理由')}${T('bad','凡走理由')}${T('next','次走への考察')}</div>
<h2>各馬の評価</h2>${r.horses.map(h=>{const e=v.h[h.no]||{};return`<div class="card"><h3>${h.pos}着 ${esc(h.name)}</h3><div class="g3"><div><label>評価</label><select id="rk${h.no}"><option></option>${opt(['S','A','B','C','D'],e.rank)}</select></div><div><label>脚質</label><select id="sy${h.no}"><option></option>${opt(STY,e.style||h.style)}</select></div><div><label>展開</label><select id="ad${h.no}"><option></option>${opt(['有利','不利','普通'],e.adv)}</select></div></div>${chips('hb'+h.no,e.tags)}<textarea id="cm${h.no}" placeholder="コメント">${esc(e.c)}</textarea><button class="s" onclick="qw('${id}',${h.no})">★注目馬に登録</button></div>`}).join('')||'<div class="empty">出走馬が未登録です</div>'}
<div class="row"><button onclick="saveRv('${id}')">回顧を保存</button></div>`}
function collect(id){const r=R(id),o={status:$('st').value,h:{}};['memo','flow','good','bad','next'].forEach(k=>o[k]=$(k).value);
r.horses.forEach(h=>o.h[h.no]={rank:$('rk'+h.no).value,style:$('sy'+h.no).value,adv:$('ad'+h.no).value,tags:chk('hb'+h.no),c:$('cm'+h.no).value});o.at=Date.now();return o}
function saveRv(id){S.rev[id]=collect(id);save();toast('回顧を保存しました');go('race-'+id)}
function qw(id,no){S.rev[id]=collect(id);const r=R(id),h=r.horses.find(x=>x.no==no),e=S.rev[id].h[no];
if(S.watch.some(w=>w.name==h.name&&w.kind=='次走注目'))return toast('すでに登録済みです');
S.watch.push({id:'w'+Date.now(),name:h.name,kind:'次走注目',prev:r.name,reasons:e.tags,dist:'',course:'',going:'',check:'未確認',memo:e.c});save();toast(h.name+'を注目馬に登録しました')}
function notes(){const q=F.q||'';return head('回顧ノート',1)+`<input placeholder="検索（レース名・メモ）" value="${esc(q)}" oninput="F.q=this.value;$('nl').innerHTML=nlist()"><div id="nl">${nlist()}</div>`}
function nlist(){const q=F.q||'',a=Object.keys(S.rev).map(id=>({r:R(id),v:S.rev[id]})).filter(x=>x.r&&(x.r.name+x.v.memo+x.v.flow+x.v.good+x.v.bad+x.v.next).includes(q)).sort((a,b)=>b.v.at-a.v.at);
return a.map(({r,v})=>`<div class="card"><h3>${esc(r.name)} <span class="b ${v.status}">${v.status}</span></h3><div class="sm">${r.date}</div><div>${esc(v.memo||'（感想なし）')}</div><div class="row"><button class="s" onclick="go('rv-${r.id}')">編集</button><button class="d" onclick="delNote('${r.id}')">削除</button></div></div>`).join('')||'<div class="empty">回顧ノートはまだありません</div>'}
function delNote(id){if(confirm('このノートを削除しますか？')){delete S.rev[id];save();toast('削除しました');render()}}
function watchL(){return head('注目馬',1)+`<div class="row"><button onclick="go('wnew')">＋注目馬を登録</button></div><div class="g2"><input placeholder="馬名で検索" value="${esc(F.wq||'')}" oninput="F.wq=this.value;$('wl').innerHTML=wl()"><select onchange="F.wk=this.value;$('wl').innerHTML=wl()">${['','次走注目','お気に入り'].map(x=>`<option ${x==F.wk?'selected':''}>${x}</option>`).join('')}</select></div><div id="wl">${wl()}</div>`}
const wl=()=>S.watch.filter(w=>w.name.includes(F.wq||'')&&(!F.wk||w.kind==F.wk)).map(wcard).join('')||'<div class="empty">該当する馬がいません</div>';
function wform(id){const w=S.watch.find(x=>x.id==id)||{name:'',kind:'次走注目',prev:'',reasons:[],dist:'',course:'',going:'',check:'未確認',memo:''};
return head(id?'注目馬編集':'注目馬登録',1)+`<div class="card"><label>馬名*</label><input id="wn" value="${esc(w.name)}"><label>区分（お気に入りと次走注目は別管理）</label><select id="wk">${opt(['次走注目','お気に入り'],w.kind)}</select><label>前走レース</label><input id="wp" value="${esc(w.prev)}"><label>注目理由（複数選択）</label>${chips('wr',w.reasons)}<div class="g2"><div><label>狙いたい距離</label><input id="wd" value="${esc(w.dist)}"></div><div><label>狙いたい競馬場</label><input id="wc" value="${esc(w.course)}"></div></div><label>狙いたい馬場状態</label><select id="wg"><option></option>${opt(['良','稍重','重','不良'],w.going)}</select><label>次走チェック状況</label><select id="wch">${opt(CHK,w.check)}</select><label>メモ</label><textarea id="wm">${esc(w.memo)}</textarea><button onclick="saveW('${id||''}')">保存</button></div>`}
function saveW(id){const n=$('wn').value.trim();if(!n)return toast('馬名を入力してください');
const o={id:id||'w'+Date.now(),name:n,kind:$('wk').value,prev:$('wp').value,reasons:chk('wr'),dist:$('wd').value,course:$('wc').value,going:$('wg').value,check:$('wch').value,memo:$('wm').value};
if(id)S.watch[S.watch.findIndex(x=>x.id==id)]=o;else S.watch.push(o);save();toast('保存しました');go('w-'+o.id)}
function watchD(id){const w=S.watch.find(x=>x.id==id);if(!w)return head('',1)+'<div class="empty">見つかりません</div>';
const hist=S.races.filter(r=>S.rev[r.id]&&Object.entries(S.rev[r.id].h).some(([no,e])=>(r.horses.find(h=>h.no==no)||{}).name==w.name)).sort((a,b)=>a.date.localeCompare(b.date));
return head('注目馬詳細',1)+`<div class="card"><h3>${esc(w.name)} <span class="b">${w.kind}</span><span class="b">${w.check}</span></h3><div class="sm">前走: ${esc(w.prev||'未入力')}｜狙い: ${esc(w.dist||'-')} / ${esc(w.course||'-')} / ${esc(w.going||'-')}</div><div>${w.reasons.map(t=>`<span class="b">${t}</span>`).join('')}</div><p>${esc(w.memo)}</p><label>次走チェック状況</label><select onchange="chW('${id}',this.value)">${opt(CHK,w.check)}</select><div class="row"><button class="s" onclick="go('wedit-${id}')">編集</button><button class="d" onclick="delW('${id}')">削除</button></div></div>
<h2>回顧履歴</h2>${hist.map(r=>{const e=Object.entries(S.rev[r.id].h).find(([no])=>r.horses.find(h=>h.no==no).name==w.name)[1];return`<div class="card tap" onclick="go('race-${r.id}')"><b>${r.date} ${esc(r.name)}</b><div>評価: ${e.rank||'-'} ${e.adv||''}</div><div class="sm">${esc(e.c)}</div></div>`}).join('')||'<div class="empty">この馬の回顧履歴はまだありません</div>'}`}
function chW(id,v){S.watch.find(x=>x.id==id).check=v;save();toast('更新しました');render()}
function delW(id){if(confirm('削除しますか？')){S.watch=S.watch.filter(x=>x.id!=id);save();toast('削除しました');go('watch')}}
function ana(){const ev=[];Object.entries(S.rev).forEach(([id,v])=>Object.values(v.h||{}).forEach(e=>e.rank&&ev.push({...e,r:R(id)})));
const cnt=(a,f)=>{const m={};a.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return m};
const bars=(m,keys)=>{const mx=Math.max(1,...Object.values(m));return(keys||Object.keys(m)).map(k=>`<div class="row" style="margin:3px 0;flex-wrap:nowrap"><div style="width:64px">${k}</div><div class="bar" style="width:${(m[k]||0)/mx*60}%"></div><div>${m[k]||0}</div></div>`).join('')};
const done=S.races.filter(r=>st(r.id)=='回顧済み');
return head('データ分析',1)+`<div class="card sm">回顧済み ${done.length}レース／馬の評価 ${ev.length}件</div>`+(ev.length<5?`<div class="empty">分析に必要なデータが不足しています（現在${ev.length}件／5件以上で表示）</div>`:`<h2>評価ランク別</h2><div class="card">${bars(cnt(ev,e=>e.rank),['S','A','B','C','D'])}</div><h2>脚質別（評価件数）</h2><div class="card">${bars(cnt(ev,e=>e.style),STY)}</div><h2>馬場状態別（評価件数）</h2><div class="card">${bars(cnt(ev,e=>e.r&&e.r.going),['良','稍重','重','不良'])}</div><h2>距離別（評価件数）</h2><div class="card">${bars(cnt(ev,e=>e.r&&e.r.dist+'m'))}</div>`)+`<div class="sm">※成績集計・AI回顧は第2・第3段階で追加予定です</div>`}
function me(){return head('マイページ・設定',1)+`<div class="card"><label>表示名</label><input id="un" value="${esc(S.user)}"><button onclick="S.user=$('un').value||'ゲスト';save();toast('保存しました')">保存</button></div><div class="card"><b>データについて</b><div class="sm">データはこの端末のブラウザにのみ保存されます。「デモデータ」表示のレースはサンプルです（外部API未接続）。レースは手動登録できます。</div></div><div class="row"><button class="s" onclick="if(confirm('デモデータを追加しますか？')){demo().forEach(d=>{if(!R(d.id))S.races.push(d)});save();toast('追加しました')}">デモデータを追加</button><button class="d" onclick="if(confirm('すべてのデータを削除しますか？')){S={races:[],rev:{},watch:[],user:'ゲスト'};save();toast('削除しました');go('home')}">全データ削除</button></div>`}
const NV=[['home','🏠','ホーム'],['races','🏇','レース'],['watch','⭐','注目馬'],['ana','📊','分析'],['me','👤','マイページ']];
function render(){const h=(location.hash||'#home').slice(1),i=h.indexOf('-'),p=i<0?h:h.slice(0,i),id=i<0?'':h.slice(i+1);
const f={home,races,race:raceD,rv:review,notes,watch:watchL,w:watchD,wnew:()=>wform(),wedit:wform,newrace:()=>rform(),redit:rform,day:dayF,ana,me}[p]||home;
$('app').innerHTML=f(id);const g={race:'races',rv:'races',newrace:'races',redit:'races',day:'races',notes:'home',w:'watch',wnew:'watch',wedit:'watch'}[p]||p;
$('nav').innerHTML=NV.map(n=>`<a class="${n[0]==g?'on':''}" onclick="go('${n[0]}')">${n[1]}<br>${n[2]}</a>`).join('');scrollTo(0,0)}
const CLS=['新馬','未勝利','1勝クラス','2勝クラス','3勝クラス','オープン','リステッド','G3','G2','G1'],WX=['晴','曇','小雨','雨','小雪','雪'],TR=['','内有利','外有利','フラット','前有利','差し有利'],SX=['牡','牝','セ'];
const AFF=['美浦','栗東','地方','海外'];const HF=[['pos','着順',48,'n'],['waku','枠',40,'n'],['uma','番',40,'n'],['name','馬名',120],['sex','性',0,'s'],['age','齢',44,'n'],['wt','斤量',58,'n'],['jockey','騎手',90],['margin','着差',70],['time','タイム',74],['pop','人気',48,'n'],['odds','オッズ',60,'n'],['l3f','上がり',60,'n'],['corner','通過順',90],['trainer','調教師',100],['aff','所属',0,'s'],['bw','馬体重',64,'n'],['bs','增減',0,'s'],['bd','增減kg',56,'n']];const bwS=h=>h.bs=='±'?`${h.bw||''}(±0)`:h.bd?`${h.bw||''}(${h.bs||'+'}${h.bd})`:(h.bw||'');
function demo(){const mk=(id,name,cls,date,course,dist,surface,wx,going,pace,hs)=>({id,name,cls,date,course,dist,surface,wx,going,pace,demo:true,horses:hs.map((a,i)=>({no:i+1,pos:i+1,waku:a[0],uma:a[1],name:a[2],sex:a[3],age:a[4],wt:a[5],jockey:a[6],margin:a[7],time:a[8],pop:a[9],odds:a[10],l3f:a[11],style:a[12]}))});
return[mk('d1','デモ記念','G2','2026-11-15','東京',2000,'芝','晴','良','ミドル',[[3,5,'アサヒノカゼ','牡',4,'58','騎手A','','1:59.8',2,'3.8','34.2','先行'],[4,7,'ミライトップ','牡',5,'58','騎手B','クビ','1:59.9',1,'2.9','33.5','差し'],[6,11,'ゴールドサンプル','牝',4,'56','騎手C','1 1/4','2:00.1',4,'8.1','34.8','逃げ'],[2,3,'ノースデモ','牡',6,'58','騎手D','1 1/2','2:00.3',3,'6.5','34.0','先行'],[7,13,'ハルノテスト','セ',7,'58','騎手E','3','2:00.8',6,'25.4','35.1','追込']]),
mk('d2','サンプルステークス','3勝クラス','2026-11-08','京都',1600,'ダート','曇','稍重','ハイ',[[2,3,'ユメノダミー','牡',4,'57','騎手F','','1:36.2',3,'5.2','36.9','差し'],[5,8,'カゼノサンプル','牡',5,'58','騎手G','1 1/4','1:36.4',1,'2.4','36.5','追込'],[1,1,'トップデモ','牡',4,'57','騎手H','3','1:36.9',2,'3.9','37.8','先行'],[7,12,'テストノヒカリ','牝',5,'55','騎手I','2','1:37.3',5,'14.0','38.0','逃げ']]),
mk('d3','テスト特別','2勝クラス','2026-11-22','中山',1800,'芝','雨','重','スロー',[[4,6,'ミライトップ','牡',5,'58','騎手B','','1:50.1',1,'2.1','35.0','先行'],[2,2,'サクラダミー','牝',4,'55','騎手J','クビ','1:50.2',4,'9.8','34.1','差し'],[6,9,'アサヒノカゼ','牡',4,'57','騎手A','2','1:50.5',2,'3.5','35.6','逃げ'],[8,14,'ホシノテスト','牡',6,'57','騎手K','3 1/2','1:50.9',3,'5.7','35.9','先行']])]}
if(!S.days)S.days=[{id:'k1',date:'2026-11-15',course:'東京',trend:'内有利',cush:'9.6',wt:'12.0',wd:'',memo:'デモデータ（サンプル）'}];
S.races=S.races.map(r=>r.demo&&!r.cls?(demo().find(d=>d.id==r.id)||r):r);save();
const rinfo=r=>`${r.date}｜${esc(r.course)}｜${r.surface}${r.dist}m｜天候:${r.wx||'-'}｜馬場:${r.going}｜ペース:${r.pace}`;
function rcard(r){return`<div class="card tap" onclick="go('race-${r.id}')"><h3>${esc(r.name)} ${r.cls?`<span class="b">${r.cls}</span>`:''}<span class="b ${st(r.id)}">${st(r.id)}</span>${r.demo?'<span class="b demo">デモデータ</span>':''}</h3><div class="sm">${rinfo(r)}</div></div>`}
const DK=(d,c)=>S.days.find(x=>x.date==d&&x.course==c);
const dsum=x=>x?`<div class="sm">芝の傾向: ${x.trend||'-'}｜クッション値: ${esc(x.cush||'-')}｜含水率 芝:${esc(x.wt||'-')} ダ:${esc(x.wd||'-')}</div>${x.memo?`<div class="sm">${esc(x.memo)}</div>`:''}`:'<div class="sm">開催日情報は未入力です</div>';
function dayHead(d,c){return`<div class="card" style="background:#fff8e1"><b>${d}　${esc(c)}</b> <button class="s" style="float:right;padding:4px 10px" onclick="openDay('${d}','${esc(c)}')">開催日情報</button>${dsum(DK(d,c))}</div>`}
function rlist(){const a=S.races.filter(r=>(!F.d||r.date==F.d)&&(!F.c||r.course.includes(F.c))&&(!F.n||r.name.includes(F.n))&&(!F.l||r.dist==F.l)&&(!F.t||r.surface==F.t)&&(!F.s||st(r.id)==F.s));
if(!a.length)return'<div class="empty">条件に合うレースがありません</div>';return[...new Set(a.map(r=>r.date+'|'+r.course))].sort().reverse().map(k=>{const[d,c]=k.split('|');return dayHead(d,c)+a.filter(r=>r.date==d&&r.course==c).map(rcard).join('')}).join('')}
function openDay(d,c){F.dk={d,c};const x=DK(d,c);go('day-'+(x?x.id:'new'))}
function dayF(id){const k=F.dk||{},x=S.days.find(y=>y.id==id)||{date:k.d,course:k.c};if(!x.date)return head('',1)+'<div class="empty">開催日を選び直してください</div>';
return head('開催日情報',1)+`<div class="card"><h3>${x.date}　${esc(x.course)}</h3><label>芝の傾向</label><select id="tr">${opt(TR,x.trend)}</select><div class="g3"><div><label>クッション値</label><input id="cu" inputmode="decimal" value="${esc(x.cush)}"></div><div><label>含水率(芝)</label><input id="hw" inputmode="decimal" value="${esc(x.wt)}"></div><div><label>含水率(ダ)</label><input id="hd" inputmode="decimal" value="${esc(x.wd)}"></div></div><label>馬場メモ（コース替わり・内外の差など）</label><textarea id="dm">${esc(x.memo)}</textarea><div class="row"><button onclick="saveDay('${id}')">保存</button>${S.days.some(y=>y.id==id)?`<button class="d" onclick="delDay('${id}')">削除</button>`:''}</div></div>`}
function saveDay(id){const k=F.dk||{},x=S.days.find(y=>y.id==id)||{id:'k'+Date.now(),date:k.d,course:k.c};Object.assign(x,{trend:$('tr').value,cush:$('cu').value.trim(),wt:$('hw').value.trim(),wd:$('hd').value.trim(),memo:$('dm').value});if(!S.days.includes(x))S.days.push(x);save();toast('保存しました');history.back()}
function delDay(id){if(confirm('開催日情報を削除しますか？')){S.days=S.days.filter(y=>y.id!=id);save();toast('削除しました');history.back()}}
function hrow(h,i){return`<tr data-no="${h.no||''}">${HF.map(f=>f[3]=='s'?`<td><select class="hf" data-k="${f[0]}" style="width:64px;margin:2px 0"><option></option>${opt(f[0]=='sex'?SX:f[0]=='bs'?['+','-','±']:AFF,h[f[0]])}</select></td>`:`<td><input class="hf" data-k="${f[0]}" style="width:${f[2]}px;margin:2px 0" ${f[3]=='n'?'inputmode="decimal"':''} value="${esc(h[f[0]]??(f[0]=='pos'?i+1:''))}"></td>`).join('')}<td><button class="d" style="padding:4px 9px" onclick="this.closest('tr').remove()">×</button></td></tr>`}
const htable=hs=>`<div class="sc"><table id="ht"><tr>${HF.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${hs.map(hrow).join('')}</table></div><div class="row"><button class="s" onclick="addH()">＋1頭追加</button></div><div class="sm">馬名が空の行は保存時に除外されます。着順の数字順に並びます。</div>`;
function addH(){const t=$('ht');t.querySelector('tbody').insertAdjacentHTML('beforeend',hrow({},t.rows.length-1))}
function getH(){const rows=[...$('ht').rows].slice(1);let mx=Math.max(0,...rows.map(r=>+r.dataset.no||0));return rows.map(r=>{const o={no:+r.dataset.no||++mx};r.querySelectorAll('.hf').forEach(e=>o[e.dataset.k]=e.value.trim());return o}).filter(o=>o.name).sort((a,b)=>(+a.pos||99)-(+b.pos||99))}
function rform(id){const r=R(id)||{name:'',cls:'',date:'',course:'',dist:'',surface:'芝',wx:'晴',going:'良',pace:'ミドル',horses:[{}]};
return head(id?'レース編集':'レース登録',1)+`<div class="card"><label>レース名*</label><input id="n" value="${esc(r.name)}"><div class="g2"><div><label>クラス</label><select id="cl"><option></option>${opt(CLS,r.cls)}</select></div><div><label>開催日*</label><input type="date" id="d" value="${r.date}"></div><div><label>競馬場</label><input id="c" value="${esc(r.course)}"></div><div><label>距離(m)</label><input id="l" type="number" value="${r.dist}"></div><div><label>芝・ダート</label><select id="t">${opt(['芝','ダート'],r.surface)}</select></div><div><label>天候</label><select id="wx">${opt(WX,r.wx)}</select></div><div><label>馬場</label><select id="g">${opt(['良','稍重','重','不良'],r.going)}</select></div><div><label>ペース</label><select id="p">${opt(['スロー','ミドル','ハイ'],r.pace)}</select></div></div><h2>出走馬</h2>${htable(r.horses.length?r.horses:[{}])}<div class="row"><button onclick="saveRace('${id||''}')">保存</button></div></div>`}
function saveRace(id){const n=$('n').value.trim(),d=$('d').value;if(!n||!d)return toast('レース名と開催日は必須です');
const o={id:id||'r'+Date.now(),name:n,cls:$('cl').value,date:d,course:$('c').value.trim(),dist:$('l').value,surface:$('t').value,wx:$('wx').value,going:$('g').value,pace:$('p').value,horses:getH(),demo:id?!!R(id).demo:false};
if(id)S.races[S.races.findIndex(r=>r.id==id)]=o;else S.races.push(o);save();toast('保存しました');go('race-'+o.id)}
function raceD(id){const r=R(id);if(!r)return head('',1)+'<div class="empty">レースが見つかりません</div>';
return head('レース詳細',1)+`<div class="card"><h3>${esc(r.name)} ${r.cls?`<span class="b">${r.cls}</span>`:''}<span class="b ${st(id)}">${st(id)}</span>${r.demo?'<span class="b demo">デモデータ</span>':''}</h3><div class="sm">${rinfo(r)}</div></div><div class="card"><b>${r.date} ${esc(r.course)} の開催日情報</b>${dsum(DK(r.date,r.course))}<div class="row"><button class="s" onclick="openDay('${r.date}','${esc(r.course)}')">開催日情報を編集</button></div></div><div class="card sc"><table><tr>${['着','枠','番','馬名','性齢','斤量','騎手','着差','タイム','人気','オッズ','上3F','通過順','調教師','所属','馬体重'].map(t=>`<th>${t}</th>`).join('')}</tr>${r.horses.map(h=>`<tr>${[h.pos,h.waku,h.uma,h.name,(h.sex||'')+(h.age||''),h.wt,h.jockey,h.margin,h.time,h.pop,h.odds,h.l3f,h.corner,h.trainer,h.aff,bwS(h)].map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="16" class="empty">出走馬が未登録です（編集から追加）</td></tr>'}</table></div><div class="row"><button onclick="go('rv-${id}')">回顧する</button><button class="s" onclick="go('redit-${id}')">編集</button><button class="d" onclick="delRace('${id}')">削除</button></div>`}
addEventListener('hashchange',render);render();
</script></body></html>
